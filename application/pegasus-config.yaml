  subscription_billing_model: per_unit
  subscription_pricing_ui: in_app
  use_2fa: y
  use_admin_docs: y
  use_api_keys: y
  use_async_example: y
  use_cloud_media_storage: y
  use_debug_toolbar: y
  use_docker: y
  use_ecommerce_example: y
  use_examples: y
  use_impersonation: y
  use_openai: y
  use_sentry: y
  use_subscriptions: y
