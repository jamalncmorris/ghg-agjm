services:
  - type: web
    name: configuration
    env: python
    buildCommand: "./deploy/build.sh"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 0 configuration.asgi:application -k uvicorn.workers.UvicornWorker"
    region: oregon
    plan: free
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.3
      - key: NODE_VERSION
        value: 18.17.1
      - key: DJANGO_SETTINGS_MODULE
        value: configuration.settings_production
      - key: DJANGO_DATABASE_NAME
        fromDatabase:
          name: configuration
          property: database
      - key: DJANGO_DATABASE_USER
        fromDatabase:
          name: configuration
          property: user
      - key: DJANGO_DATABASE_PASSWORD
        fromDatabase:
          name: configuration
          property: password
      - key: DJANGO_DATABASE_HOST
        fromDatabase:
          name: configuration
          property: host
      - key: DJANGO_DATABASE_PORT
        fromDatabase:
          name: configuration
          property: port
      - key: REDIS_HOST
        fromService:
          type: redis
          name: configuration-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: configuration-redis
          property: port
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_ANALYTICS_ID
        sync: false
      - key: STRIPE_LIVE_MODE
        value: True
      - key: STRIPE_LIVE_PUBLIC_KEY
        sync: false
      - key: STRIPE_LIVE_SECRET_KEY
        sync: false
      - key: DJSTRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

